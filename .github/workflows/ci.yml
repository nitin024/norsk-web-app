name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Content validator + DOM, CSS and rendered-layout suites. The render
      # suite skips itself when Chrome is absent, so it is safe here either way.
      - run: npm test
