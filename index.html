<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <title>Norsk — lesing</title>
    <!-- Inline SVG favicon: same mark as the brand, no asset path to break
         under a GitHub Pages sub-directory. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='10' fill='%23faf8f5'/%3E%3Cpath d='M17 7 V41 M5 22.5 H43' stroke='%231f1d1a' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
    <link rel="apple-touch-icon" href="icon.svg" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#reader">Hopp til teksten</a>

    <div id="page">
      <header class="topbar">
        <button id="back" class="back" type="button" hidden aria-label="Tilbake">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor"
                  stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>

        <!-- Always present, always the way home. Inline SVG so there is no
             asset path to break on GitHub Pages, and currentColor makes it
             follow the light/dark theme. -->
        <a id="brand" class="brand" href="#" aria-label="Norsk — til forsiden">
          <svg class="brand-mark" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
            <path d="M17 7 V41 M5 22.5 H43" stroke="currentColor" stroke-width="6"
                  stroke-linecap="round" />
          </svg>
          <span class="brand-text">
            <span class="brand-name">Norsk</span>
            <span class="brand-tagline">lese · muntlig</span>
          </span>
        </a>

        <div class="topbar-page">
          <h1 id="doc-title" tabindex="-1"></h1>
          <p id="doc-meta" class="meta"></p>
        </div>
      </header>

      <div id="dict-controls" class="dict-controls" hidden>
        <input
          id="dict-search"
          class="dict-search"
          type="search"
          lang="nb"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Søk etter ord…"
          aria-label="Søk i ordboka"
        />
        <div class="dict-row-controls">
          <div id="dict-filters" class="dict-filters" role="group" aria-label="Filtrer på ordklasse"></div>
          <button id="dict-gloss-toggle" class="gloss-toggle" type="button" aria-pressed="false">
            Vis engelsk
          </button>
          <button id="dict-view-toggle" class="gloss-toggle" type="button" aria-pressed="false">
            Kort
          </button>
        </div>
      </div>

      <div id="scratch-controls" class="scratch-controls" hidden>
        <label class="visually-hidden" for="scratch-input">Lim inn norsk tekst</label>
        <textarea
          id="scratch-input"
          class="scratch-input"
          lang="nb"
          rows="4"
          placeholder="Lim inn en tekst fra en avis eller nettside…"
        ></textarea>
        <div class="scratch-actions">
          <button id="scratch-read" class="btn-primary" type="button">Les teksten</button>
          <button id="scratch-clear" class="btn-quiet" type="button">Tøm</button>
        </div>
        <p id="scratch-stats" class="scratch-stats" role="status" aria-live="polite"></p>
      </div>

      <main id="reader" class="reader" tabindex="-1"></main>
    </div>

    <!-- Jump rail for the dictionary: 1080 entries is too many to scroll. -->
    <nav id="letter-rail" class="letter-rail" aria-label="Hopp til bokstav" hidden></nav>

    <!-- The reading modes. A bar of its own above the tab bar, so a text
         begins at the top of the screen instead of below its controls. -->
    <div id="mode-bar" class="mode-bar" hidden></div>

    <!-- Phone navigation. The four places the time actually goes; the rest
         hang off Kurs and home. Hidden on wide screens, where the topbar and
         the home page are enough. -->
    <nav id="tabbar" class="tabbar" aria-label="Hovednavigasjon">
      <a class="tab" href="#/kurs" data-tab="course">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M4 5.5h6a2 2 0 0 1 2 2v11a2 2 0 0 0-2-2H4zM20 5.5h-6a2 2 0 0 0-2 2v11a2 2 0 0 1 2-2h6z"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
        </svg>
        <span>Kurs</span>
      </a>
      <a class="tab" href="#/tekster" data-tab="texts">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path d="M5 4.5h14M5 9.5h14M5 14.5h10M5 19.5h7"
                fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <span>Tekster</span>
      </a>
      <a class="tab" href="#/ordbok" data-tab="dict">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <span>Ordbok</span>
      </a>
      <a class="tab" href="#/ov" data-tab="review">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="4" y="6" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7" />
          <path d="M8 3.5h9a3 3 0 0 1 3 3v9" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <span>Øving</span>
        <span id="tab-review-badge" class="tab-badge" hidden></span>
      </a>
      <a class="tab" href="#/mer" data-tab="more">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="5.5" cy="12" r="1.6" fill="currentColor" />
          <circle cx="12" cy="12" r="1.6" fill="currentColor" />
          <circle cx="18.5" cy="12" r="1.6" fill="currentColor" />
        </svg>
        <span>Mer</span>
      </a>
    </nav>

    <!-- Announces view changes without re-reading the whole paragraph, which
         is what aria-live on the text body itself would do. -->
    <p id="announcer" class="visually-hidden" role="status" aria-live="polite"></p>

    <div id="card-scrim" class="scrim" hidden></div>
    <aside
      id="card"
      class="card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="card-headword"
      hidden
    >
      <button id="card-close" class="card-close" aria-label="Lukk ordkort">×</button>
      <div id="card-body"></div>
    </aside>

    <script type="module" src="app.js"></script>
  </body>
</html>
