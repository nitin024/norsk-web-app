<!doctype html>
<html lang="nb">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <title>Norsk — lesing</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="skip-link" href="#reader">Hopp til teksten</a>

    <div id="page">
      <header class="topbar">
        <button id="back" class="back" type="button" hidden>‹ Alle tekster</button>
        <h1 id="doc-title" tabindex="-1">Norsk</h1>
        <p id="doc-meta" class="meta"></p>
      </header>

      <main id="reader" class="reader" tabindex="-1"></main>
    </div>

    <!-- Announces view changes without re-reading the whole paragraph, which
         is what aria-live on the text body itself would do. -->
    <p id="announcer" class="visually-hidden" role="status" aria-live="polite"></p>

    <div id="card-scrim" class="scrim" hidden></div>
    <aside
      id="card"
      class="card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="card-headword"
      hidden
    >
      <button id="card-close" class="card-close" aria-label="Lukk ordkort">×</button>
      <div id="card-body"></div>
    </aside>

    <script type="module" src="app.js"></script>
  </body>
</html>
